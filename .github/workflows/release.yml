name: Release & Publish to NPM

# Every push to main publishes a new patch version.
# The version-bump commit is pushed with GITHUB_TOKEN, which does not trigger
# another workflow run, so this cannot loop.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Release the tip of main, not the triggering commit: runs are serialized,
      # so this includes the previous run's version bump.
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install & Verify
        run: |
          npm ci
          npm run lint
          npm run typecheck

      - name: Bump Patch Version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION=$(npm version patch -m "chore(release): %s [skip ci]")
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to NPM
        run: npm publish --access public

      - name: Push Version Commit & Tag
        # main may have moved while this run was publishing: rebase the bump on top
        run: |
          git pull --rebase origin main
          git tag -f "${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
